[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "equimanip"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "mujoco==3.15.0",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["equimanip"]
